name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Ноутбук собран из актуальных исходников
        run: python tools/make_colab.py --check
      - name: Тесты библиотеки на синтетических изображениях
        run: pytest -q tests
